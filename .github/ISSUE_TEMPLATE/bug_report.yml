name: 缺陷报告
description: 报告可复现的数据、模型、看板或文档问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题现象
      description: 请说明预期结果和实际结果，不要粘贴密钥或个人信息。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: 命令、页面、筛选条件、数据截止时间
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 验证证据
      description: 可提供脱敏日志、测试名称或截图路径。
